site_name: 培训资料
site_url: https://sun2401060413.github.io/notes/
theme: material
extra:
    search:
        language: 'en,ja'

site_description: '云笔记'
docs_dir: docs
site_dir: site
nav:
    - 主页: index.md
    - 培训:
        - OpenCV:
            - OpenCV 培训: 2019_summer/opencv/opencv.md
            - OpenCV CheatSheet: 2019_summer/opencv/cheatsheet.md
            - opencv 常用程序（一）: 2019_summer/opencv/video2image.md
        - Deep Learning:
            - Classification 接口: 2019_summer/deeplearning/classification.md
            - 训练参数配置记录: 2019_summer/deeplearning/alexnet.md
            - Densenet: 2019_summer/deeplearning/densenet.md
            - 资料: 2019_summer/deeplearning/references.md
        - Unity:
            - FreewayEquipment: 2019_summer/Unity/FreewayEquipment.md
    - 自动驾驶:
        - 车路协同自动驾驶资料搜集: auto-driving/Readme.md
        - 自动驾驶感知: auto-driving/Perception.md
    - 项目:
        - 高速公路环境状态辨识: resume/EnvirDetection.md
        - 三维数字孪生应急演练系统: resume/HZMB.md
    - 自用主页: home/mainpage.md
extra_javascript:
    - 'js/extra.js'
    - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML'
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - footnotes
  - meta
  - def_list
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: underscore
  - pymdownx.caret
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_png
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde